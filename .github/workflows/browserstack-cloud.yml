name: BrowserStack Cloud Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  browserstack:

    name: Playwright BrowserStack

    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:
      TEST_ENV: qa

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: BrowserStack Env Setup
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: 'BUILD_INFO'
          project-name: 'Playwright Enterprise Framework'


      - name: Verify BrowserStack variables
        shell: bash
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ]; then
            echo "BROWSERSTACK_USERNAME is missing"
            exit 1
          fi

          if [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "BROWSERSTACK_ACCESS_KEY is missing"
            exit 1
          fi

          echo "BrowserStack credentials are available"


      - name: TypeScript validation
        run: npx tsc --noEmit


      - name: Run BrowserStack Cloud Tests
        run: npm run test:cloud


      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browserstack-playwright-report
          path: playwright-report/cloud/
          retention-days: 14


      - name: Upload BrowserStack SDK Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browserstack-sdk-logs
          path: log/
          retention-days: 7