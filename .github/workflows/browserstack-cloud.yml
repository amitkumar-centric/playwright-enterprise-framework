name: BrowserStack Cloud Tests

permissions:
  contents: read

on:
  push:

  workflow_dispatch:

jobs:

  browserstack:

    name: Playwright BrowserStack

    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:

      TEST_ENV: qa

      BROWSERSTACK_USERNAME:
        ${{ secrets.BROWSERSTACK_USERNAME }}

      BROWSERSTACK_ACCESS_KEY:
        ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6


      - name: Setup Node
        uses: actions/setup-node@v6
        with:

          node-version: 20

          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Prepare BrowserStack SDK Directory
        run: |
          export BROWSERSTACK_FILES_DIR="$RUNNER_TEMP/browserstack-sdk"
          mkdir -p "$BROWSERSTACK_FILES_DIR"
          echo "BROWSERSTACK_FILES_DIR=$BROWSERSTACK_FILES_DIR" >> "$GITHUB_ENV"


      - name: TypeScript validation
        run: npx tsc --noEmit


      - name: Run BrowserStack Cloud Tests
        run: |
          for attempt in 1 2 3; do
            npm run test:cloud && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "BrowserStack bootstrap failed on attempt $attempt. Retrying..."
            sleep 15
          done


      - name: Upload Playwright Report
        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: browserstack-playwright-report

          path: playwright-report/cloud/

          retention-days: 14


      - name: Upload Test Results
        if: always()

        uses: actions/upload-artifact@v7

        with:

          name: browserstack-test-results

          path: test-results/

          retention-days: 14
