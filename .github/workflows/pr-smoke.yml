name: PR Smoke Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - master

jobs:

  smoke:

    name: Smoke Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      TEST_ENV: qa
      SECRET_PROVIDER: env

      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run smoke tests
        run: >
          npm run test:framework --
          --env=qa
          --project=chromium
          --grep "@smoke"
          --grep-invert "@flaky"
          --max-failures=1

      - name: Generate Allure Report
        if: always()
        run: >
          npx allure generate
          allure-results
          --clean
          -o allure-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-smoke-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-smoke-allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-smoke-test-results
          path: test-results/
          retention-days: 14