name: Nightly Regression

permissions:
  contents: read

on:
  schedule:
    - cron: '30 18 * * *'

  workflow_dispatch:

jobs:
  regression:
    name: Regression - ${{ matrix.browser }} - Shard ${{ matrix.shard }}/4

    runs-on: ubuntu-latest

    timeout-minutes: 90

    strategy:
      fail-fast: false

      matrix:
        browser:
          - chromium
          - firefox
          - webkit

        shard:
          - 1
          - 2
          - 3
          - 4

    env:
      TEST_ENV: staging
      SECRET_PROVIDER: env

      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run regression shard
        run: >
          npm run test:framework --
          --env=staging
          --project=${{ matrix.browser }}
          --grep "@regression"
          --grep-invert "@flaky"
          --shard=${{ matrix.shard }}/4

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 30
